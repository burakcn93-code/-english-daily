<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17243a"><link rel="manifest" href="manifest.json"><title>English Daily</title><style>
:root{--n:#17243a;--b:#3286d8;--bg:#f3f6fb;--m:#718096;--g:#16865d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui;color:#182338}header{background:var(--n);color:white;padding:22px 18px;border-radius:0 0 24px 24px}.wrap{max-width:650px;margin:auto;padding:0 15px 30px}.brand{font-size:24px;font-weight:850}.sub,.small{color:var(--m);font-size:13px}.sub{color:#c5d3e5}.stats,.tabs,.actions{display:flex;gap:8px;margin-top:14px}.stat{background:#263b58;border-radius:12px;padding:10px;flex:1}.stat b{display:block;font-size:21px}.stat span{font-size:11px;color:#c5d3e5}button{border:0;border-radius:12px;padding:12px;background:var(--b);color:white;font-weight:750;cursor:pointer}.alt{background:#e5edf7;color:#29415f}.tabs button,.actions button{flex:1;font-size:12px;padding:11px 5px}.card,.panel{background:white;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 7px 25px #233b5a10}.word{font-size:37px;font-weight:850;margin:12px 0 0}.pron,.translation{font-size:13px;color:var(--m)}.reveal{border-top:1px solid #edf1f6;margin-top:16px;padding-top:15px}.meaning{font-size:23px;color:var(--g);font-weight:850}.sentence{font-size:17px;font-weight:650;margin-top:12px}.progress{height:7px;background:#e7edf5;border-radius:8px;margin:10px 0;overflow:hidden}.progress i{height:100%;display:block;background:var(--b)}.row{padding:10px 0;border-bottom:1px solid #edf1f6}.hide{display:none!important}input{width:100%;padding:12px;border:1px solid #dce4ef;border-radius:10px;margin:5px 0;font-size:16px}footer{text-align:center;color:var(--m);font-size:11px;margin:20px}</style></head><body><header><div class="wrap"><div class="brand">✦ English Daily</div><div class="sub">A1 · Her gün biraz daha iyi İngilizce</div><div class="stats"><div class="stat"><b id="learned">0</b><span>Öğrenilen</span></div><div class="stat"><b id="due">0</b><span>Tekrar zamanı</span></div><div class="stat"><b id="today">0/15</b><span>Bugünkü kelime</span></div></div></div></header><div class="wrap"><nav class="tabs"><button data-tab="learn">Kelime</button><button class="alt" data-tab="sentences">Cümle</button><button class="alt" data-tab="review">Tekrar</button><button class="alt" data-tab="quiz">Test</button></nav>
<section id="learn"><div class="small" id="counter"></div><div class="progress"><i id="bar"></i></div><div class="card"><div class="small">ÖNCE İNGİLİZCEYİ HATIRLA</div><div class="word" id="word">Yükleniyor…</div><div class="pron" id="pron">A1</div><div id="answer" class="reveal hide"><div class="meaning" id="meaning"></div><div class="sentence" id="sentence"></div><div class="translation" id="translation"></div></div><p><button id="show">Türkçe anlamı göster</button> <button class="alt" id="speak">🔊 Dinle</button></p></div><div class="actions"><button class="alt" id="prev">← Geri</button><button id="known">✓ Öğrendim</button><button class="alt" id="next">Sonraki →</button></div></section>
<section id="sentences" class="hide panel"><h3>Günün cümleleri</h3><div id="sentenceList"></div></section><section id="review" class="hide panel"><h3>Tekrar zamanı gelenler</h3><div id="reviewList"></div></section><section id="quiz" class="hide panel"><h3>Mini test</h3><div id="quizArea"></div><button id="newQuiz">Yeni soru</button></section>
<div class="panel"><h3>Kendi kelimeni ekle</h3><input id="newWord" placeholder="İngilizce kelime"><input id="newMeaning" placeholder="Türkçe anlamı"><input id="newSentence" placeholder="İngilizce örnek cümle"><input id="newTranslation" placeholder="Türkçe çevirisi"><button id="add" style="width:100%">Kelimeyi ekle</button></div><footer>İlerlemen bu cihazın tarayıcısında saklanır. Kelime paketi internetten yüklenir.</footer></div>
<script>
let bank=[],custom=JSON.parse(localStorage.getItem("ed_custom")||"[]"),progress=JSON.parse(localStorage.getItem("ed_progress")||"{}"),idx=0,daily=[];const $=x=>document.getElementById(x),key=()=>new Date().toISOString().slice(0,10),all=()=>[...bank,...custom],id=w=>w.id||w.uid;
function save(){localStorage.setItem("ed_custom",JSON.stringify(custom));localStorage.setItem("ed_progress",JSON.stringify(progress))}
function getDaily(){let old=JSON.parse(localStorage.getItem("ed_daily")||"{}");if(old.date===key())return old.ids.map(x=>all().find(w=>id(w)===x)).filter(Boolean);let a=all().filter(w=>!progress[id(w)]).sort(()=>Math.random()-.5).slice(0,15);localStorage.setItem("ed_daily",JSON.stringify({date:key(),ids:a.map(id)}));return a}
function due(){return all().filter(w=>progress[id(w)]&&progress[id(w)].due<=Date.now())}
function stats(){$("learned").textContent=Object.keys(progress).length;$("due").textContent=due().length;$("today").textContent=daily.filter(w=>progress[id(w)]).length+"/15"}
function render(){let w=daily[idx];stats();if(!w){$("word").textContent="Bugünkü kelimeler tamamlandı! 🎉";$("counter").textContent="Yarın yeni kelimeler gelecek.";return}$("word").textContent=w.en;$("pron").textContent=w.pron||"A1";$("meaning").textContent=w.tr;$("sentence").textContent=w.sentence||"";$("translation").textContent=w.meaning||"";$("answer").classList.add("hide");$("show").textContent="Türkçe anlamı göster";$("counter").textContent=`Bugünkü kelime ${idx+1} / ${daily.length}`;$("bar").style.width=((idx+1)/daily.length*100)+"%";$("known").disabled=!!progress[id(w)];$("known").textContent=progress[id(w)]?"✓ Öğrenildi":"✓ Öğrendim"}
$("show").onclick=()=>{$("answer").classList.toggle("hide");$("show").textContent=$("answer").classList.contains("hide")?"Türkçe anlamı göster":"Anlamı gizle"};$("speak").onclick=()=>{let w=daily[idx];if(!w)return;if(!("speechSynthesis"in window)||!("SpeechSynthesisUtterance"in window)){alert("Bu tarayıcı sesli telaffuzu desteklemiyor. iPhone'da Safari'nin güncel sürümünü kullan.");return}const say=()=>{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang="en-US";u.rate=.82;const voices=window.speechSynthesis.getVoices();const v=voices.find(x=>x.lang==="en-US")||voices.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));if(v)u.voice=v;window.speechSynthesis.speak(u)};if(window.speechSynthesis.getVoices().length){say()}else{window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;say()};say()}};$("next").onclick=()=>{idx=Math.min(idx+1,daily.length-1);render()};$("prev").onclick=()=>{idx=Math.max(0,idx-1);render()};$("known").onclick=()=>{let w=daily[idx];if(!w)return;progress[id(w)]={due:Date.now()+86400000,learnedAt:Date.now()};save();idx=Math.min(idx+1,daily.length-1);render()};
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showReview(){$("reviewList").innerHTML=due().length?due().map(w=>`<div class="row"><b>${esc(w.en)}</b> — ${esc(w.tr)}</div>`).join(""):"Henüz tekrar zamanı gelen kelime yok. İlk tekrar 1 gün sonra."}
function showSentences(){$("sentenceList").innerHTML=all().slice(0,15).map(w=>`<div class="row"><b>${esc(w.sentence)}</b><div class="small">${esc(w.meaning)}</div></div>`).join("")}
function quiz(){let a=all();let q=a[Math.floor(Math.random()*a.length)],opts=[q,...a.filter(w=>w.id!==q.id).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$("quizArea").innerHTML=`<p><b>${esc(q.en)}</b> kelimesinin anlamı?</p>`+opts.map(w=>`<button class="alt" data-v="${esc(w.tr)}" style="display:block;width:100%;margin:6px 0">${esc(w.tr)}</button>`).join("");$("quizArea").querySelectorAll("button").forEach(b=>b.onclick=()=>{let ok=b.dataset.v===q.tr;$("quizArea").insertAdjacentHTML("beforeend",`<p style="color:${ok?'green':'#b44'}">${ok?'Doğru!':'Doğru cevap: '+esc(q.tr)}</p>`);$("quizArea").querySelectorAll("button").forEach(x=>x.disabled=true)})}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{let t=b.dataset.tab;["learn","sentences","review","quiz"].forEach(x=>$(x).classList.toggle("hide",x!==t));document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("alt",x!==b));if(t==="review")showReview();if(t==="sentences")showSentences();if(t==="quiz")quiz()});$("newQuiz").onclick=quiz;
$("add").onclick=()=>{let en=$("newWord").value.trim(),tr=$("newMeaning").value.trim();if(!en||!tr){alert("İngilizce kelime ve Türkçe anlamını gir.");return}custom.push({uid:"c"+Date.now(),en,tr,sentence:$("newSentence").value,meaning:$("newTranslation").value});save();daily=getDaily();alert("Kelime eklendi.");render()};
fetch("data/a1.json").then(r=>r.json()).then(d=>{bank=d;daily=getDaily();render()}).catch(()=>{$("word").textContent="Kelime paketi yüklenemedi. İnternet bağlantını kontrol et."});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
